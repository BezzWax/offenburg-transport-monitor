
name: Daily Offenburg Transport Check

on:
  schedule:
    - cron: "0 7 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-offenburg-transport-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Collect transport notices and send report
        run: npm run check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          DRY_RUN: "false"
